name: Build NexusVM APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false

    - name: Install Android NDK and CMake
      run: |
        sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

    # Безопасный и точный патчинг C++ кода через Python (работает при любой структуре папок)
    - name: Patch C++ Source Files for Compatibility
      run: |
        python3 -c "
        import os, re
        
        # 1. Лечим файл syscall_interceptor.cpp (добавляем фейковый макрос mknod в самое начало)
        for root, dirs, files in os.walk('.'):
            if 'syscall_interceptor.cpp' in files:
                path = os.path.join(root, 'syscall_interceptor.cpp')
                with open(path, 'r', encoding='utf-8') as f:
                    content = f.read()
                if '#define __NR_mknod' not in content:
                    content = '#define __NR_mknod 9999\n' + content
                    with open(path, 'w', encoding='utf-8') as f:
                        f.write(content)
                    print('Успешно добавлен макрос mknod в syscall_interceptor.cpp')

        # 2. Лечим файл fakeroot_inject.cpp (исправляем типы аргументов ioctl)
        for root, dirs, files in os.walk('.'):
            if 'fakeroot_inject.cpp' in files:
                path = os.path.join(root, 'fakeroot_inject.cpp')
                with open(path, 'r', encoding='utf-8') as f:
                    content = f.read()
                
                # Ищем точное объявление функции ioctl независимо от пробелов и переносов
                pattern = r'int\s+ioctl\s*\(\s*int\s+fd\s*,\s*unsigned\s+long\s+request\s*,\s*\.\.\.\s*\)'
                replacement = 'int ioctl(int fd, int request, ...)'
                
                if re.search(pattern, content):
                    content = re.sub(pattern, replacement, content)
                    with open(path, 'w', encoding='utf-8') as f:
                        f.write(content)
                    print('Успешно исправлена сигнатура ioctl в fakeroot_inject.cpp')
                else:
                    print('Предупреждение: сигнатура ioctl не найдена или уже изменена')
        "

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        if [ -f ./gradlew ] || [ -f ./build.gradle ]; then
          gradle assembleDebug
        else
          cd *NexusVM* 2>/dev/null || cd app 2>/dev/null || true
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nexusvm-debug-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/**/*.apk
        if-no-files-found: error
        
