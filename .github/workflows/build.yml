name: Build NexusVM APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false

    - name: Install Android NDK and CMake
      run: |
        sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

    # Используем официальный экшен Gradle, который сам сгенерирует или найдет обертку
    - name: Setup and Run Gradle Build
      uses: gradle/actions/setup-gradle@v4
      with:
        arguments: assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nexusvm-debug-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/**/*.apk
        if-no-files-found: error
        
