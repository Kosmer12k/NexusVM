name: Build NexusVM APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false

    - name: Install Android NDK and CMake
      run: |
        sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    # Принудительно отключаем строгость компилятора Clang к ошибкам типов в коде C++
    - name: Build Debug APK with Compiler Flags
      run: |
        gradle assembleDebug \
          -Pandroid.アンプロテクテッド_flags="-Wno-error -Wno-implicit-function-declaration" \
          -Dorg.gradle.project.android.ndk.cxxFlags="-Wno-error"
          
